<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- site-meta -->
    <meta name="theme-color" content="#FFF5E0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#190933" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/images/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Elvis Brevi" href="/rss.xml" />
    <!-- Body and headline fonts, requested before the CSS that uses them is parsed -->
    <link rel="preload" href="/node_modules/@fontsource/newsreader/files/newsreader-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/dela-gothic-one/files/dela-gothic-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Prevent FOUC: apply theme before render -->
    <script>
      (function () {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Prevent white flash on load -->
    <style>
      html {
        background-color: #FFF5E0;
        color: #190933;
      }
      html[data-theme="dark"] {
        background-color: #190933;
        color: #FFF5E0;
      }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BQM69H99KC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BQM69H99KC');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
